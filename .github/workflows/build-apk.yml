name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Cross-compile Rust .so + assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk

      # cargo-ndk 不在 taiki-e/install-action 的支持清单里，会 fallback 到
      # 受 GitHub API 限流影响的 cargo-binstall。这里直接从源码装，最可靠。
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # ubuntu-latest 已经预装 Android SDK。setup-android@v3 在新版 runner 上
      # 会因找不到旧 'tools' 包而崩（Failed to find package 'tools'），
      # 所以直接用 runner 自带的 sdkmanager，不再引入这个 action。
      - name: Install NDK / platform / build-tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.3.11579264" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK="$SDK/ndk/26.3.11579264"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          test -d "$NDK" || { echo "::error::NDK 未安装成功"; exit 1; }
          test -x "$SDK/build-tools/35.0.0/apksigner" || { echo "::error::apksigner 缺失"; exit 1; }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cross-compile domainmail-core for 3 ABIs
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release -p domainmail-core
          echo "--- produced .so files ---"
          find android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      # setup-gradle 的 gradle-version 已把 gradle 加进 PATH，直接用 CLI，
      # 不额外跑 `gradle wrapper`（那会多一次 settings 求值 + 插件解析，多一个失败点）。
      - name: Assemble signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没有生成 APK"; exit 1; fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -20

      # Gradle 在没有任何 Kotlin 源文件时也能"构建成功"，产出的却是没有
      # Activity 的空壳 APK（装上直接闪退）。这里强制校验产物内容。
      - name: Verify APK actually contains app classes
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          apks = glob.glob('android/app/build/outputs/apk/release/*.apk')
          if not apks:
              sys.exit('::error::没有找到 APK')
          z = zipfile.ZipFile(apks[0])
          dex = b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))

          required = [
              b'Lcom/ifwqu/domainmail/MainActivity;',
              b'Lcom/ifwqu/domainmail/RustBridge;',
              b'nativeCall',
              b'domainmail_core',
          ]
          missing = [s.decode() for s in required if s not in dex]
          native = sorted(n for n in z.namelist() if n.endswith('libdomainmail_core.so'))
          print('native libs:', native)

          if missing:
              sys.exit('::error::APK 的 dex 缺少应用类: ' + ', '.join(missing))
          if len(native) < 3:
              sys.exit('::error::APK 缺少多 ABI 的 Rust .so: ' + str(native))
          print('APK 内容校验通过：Activity / JNI 桥 / 三 ABI native 库齐全')
          PY

      - name: Rename artifact
        run: |
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp "$APK" "dist/domainmail-${SAFE_REF:-dev}.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: domainmail-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
